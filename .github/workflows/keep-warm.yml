name: Keep backend warm

# Render's free tier sleeps a web service after ~15 minutes of no traffic, so
# the next visitor waits ~40s for a cold start. This pings the health endpoint
# every 10 minutes to keep it awake. Run it manually from the Actions tab
# (Run workflow) to warm the server right before a demo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          curl -sS -m 90 --retry 3 --retry-all-errors \
            https://pashupehchan-api.onrender.com/health || true
